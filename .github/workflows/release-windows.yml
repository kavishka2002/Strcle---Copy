name: Publish Windows desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the tag, package version, and checked-out commit
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH versions." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          lock_version="$(node -p 'require("./package-lock.json").version')"
          root_lock_version="$(node -p 'require("./package-lock.json").packages[""].version')"
          if [[ "$tag_version" != "$package_version" ||
                "$package_version" != "$lock_version" ||
                "$package_version" != "$root_lock_version" ]]; then
            echo "Tag, package.json, and package-lock.json versions must all match." >&2
            exit 1
          fi
          checked_out_commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [[ "$checked_out_commit" != "$tagged_commit" ]]; then
            echo "The checked-out commit does not match the release tag." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Build desktop production files
        run: npm run desktop:build

      - name: Build Windows installer without publishing
        run: npx electron-builder --win nsis --publish never

      - name: Validate generated update assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/verify-desktop-release.cjs release "$version"

      - name: Refuse to alter an existing release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "LittlePaper $GITHUB_REF_NAME" \
            --notes "LittlePaper $GITHUB_REF_NAME Windows desktop release" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload validated update assets
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          gh release upload "$GITHUB_REF_NAME" \
            "release/LittlePaper-Setup-${version}.exe" \
            "release/latest.yml" \
            "release/LittlePaper-Setup-${version}.exe.blockmap" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify published draft assets
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          installer="LittlePaper-Setup-${version}.exe"
          blockmap="${installer}.blockmap"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")"
          for asset in "$installer" "latest.yml" "$blockmap"; do
            if ! grep -Fxq -- "$asset" <<< "$assets"; then
              echo "Required release asset is missing: $asset" >&2
              exit 1
            fi
          done
          verify_directory="$(node -e 'const fs = require("node:fs"); const os = require("node:os"); const path = require("node:path"); process.stdout.write(fs.mkdtempSync(path.join(os.tmpdir(), "littlepaper-release-verify-")))')"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$installer" \
            --pattern "latest.yml" \
            --pattern "$blockmap" \
            --dir "$verify_directory" \
            --repo "$GITHUB_REPOSITORY"
          node scripts/verify-desktop-release.cjs release "$version" "$verify_directory"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
