name: Publish Windows desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the tag matches package version
        shell: bash
        run: |
          node -e 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== "v" + version) { console.error("Tag must match package.json version " + version); process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: npm run desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish NSIS differential update blockmap
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          blockmap="release/LittlePaper Setup ${version}.exe.blockmap"
          safe_blockmap="release/LittlePaper-Setup-${version}.exe.blockmap"
          test -f "$blockmap"
          cp "$blockmap" "$safe_blockmap"
          gh release upload "$GITHUB_REF_NAME" "$safe_blockmap" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
