name: Publish Windows desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the tag matches package version
        shell: bash
        run: |
          node -e 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== "v" + version) { console.error("Tag must match package.json version " + version); process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer without publishing
        shell: bash
        run: |
          npm run desktop:build
          npx electron-builder --win nsis --publish never

      - name: Prepare and validate update assets
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          installer="release/LittlePaper Setup ${version}.exe"
          blockmap="${installer}.blockmap"
          safe_installer="release/LittlePaper-Setup-${version}.exe"
          safe_blockmap="${safe_installer}.blockmap"
          manifest="release/latest.yml"
          test -s "$installer"
          test -s "$blockmap"
          test -s "$manifest"
          cp "$installer" "$safe_installer"
          cp "$blockmap" "$safe_blockmap"
          test -s "$safe_installer"
          test -s "$safe_blockmap"
          RELEASE_VERSION="$version" node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const [manifestPath, installerPath, installerName] = process.argv.slice(1);
            async function validate() {
              const manifest = fs.readFileSync(manifestPath, "utf8");
              const scalar = key => {
                const match = manifest.match(new RegExp(`^${key}: (.+)$`, "m"));
                return match?.[1];
              };
              const fileSize = manifest.match(/^\s+size: (\d+)$/m)?.[1];
              const actualSize = fs.statSync(installerPath).size;
              const hash = crypto.createHash("sha512");
              await new Promise((resolve, reject) => {
                const stream = fs.createReadStream(installerPath);
                stream.on("data", chunk => hash.update(chunk));
                stream.once("error", reject);
                stream.once("end", resolve);
              });
              const actualSha512 = hash.digest("base64");
              if (scalar("version") !== process.env.RELEASE_VERSION ||
                  scalar("path") !== installerName ||
                  !manifest.split(/\r?\n/).some(line => line.trim() === `- url: ${installerName}`) ||
                  fileSize !== String(actualSize) ||
                  scalar("sha512") !== actualSha512) {
                throw new Error("latest.yml does not match the installer version, filename, size, and SHA-512.");
              }
            }
            validate().catch(error => {
              console.error(error);
              process.exitCode = 1;
            });
          ' "$manifest" "$safe_installer" "$(basename "$safe_installer")"

      - name: Create draft release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "LittlePaper $GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update assets to draft release
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          gh release upload "$GITHUB_REF_NAME" \
            "release/LittlePaper-Setup-${version}.exe" \
            "release/latest.yml" \
            "release/LittlePaper-Setup-${version}.exe.blockmap" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets before publishing
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")"
          for asset in \
            "LittlePaper-Setup-${version}.exe" \
            "latest.yml" \
            "LittlePaper-Setup-${version}.exe.blockmap"; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              echo "Required release asset is missing: $asset" >&2
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}